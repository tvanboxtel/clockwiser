<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clockwiser</title>
    <script>
      // Apply the saved theme before first paint so reloads don't flash the
      // default palette. Keep the key in sync with STORAGE_KEY in src/theme.ts.
      try {
        var t =
          new URLSearchParams(location.search).get('theme') ||
          localStorage.getItem('clockwiser:theme')
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light' || t === 'pastel'
            ? t
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
